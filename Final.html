<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOKA Restaurant</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#d6ad60;--bg:#090909;--card:#191919;--green:#239b56}
body{font-family:Cairo,sans-serif;background:var(--bg);color:white}
button,select{font-family:inherit;cursor:pointer}
#languageScreen{min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px;background:linear-gradient(#000b,#000d),url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4') center/cover}
.language-box{background:#111e;border:1px solid var(--gold);padding:40px 25px;border-radius:22px;width:100%;max-width:480px}
.logo{font-size:65px;color:var(--gold);font-weight:900;letter-spacing:9px}
.language-box p{color:#bbb;margin:12px}
.language-buttons{display:flex;gap:12px;margin-top:20px}
.language-buttons button{flex:1;padding:13px;background:var(--gold);border:0;border-radius:10px;font-size:17px;font-weight:bold}
#website{display:none}
header{text-align:center;padding:65px 15px;background:linear-gradient(#0009,#000c),url('https://images.unsplash.com/photo-1414235077428-338989a2e8c0') center/cover;border-bottom:2px solid var(--gold)}
header .brand{font-size:65px;color:var(--gold);font-weight:900;letter-spacing:9px}
header h2{font-size:27px}
header p{color:#ddd;margin:12px}
.gold-btn,.outline-btn{padding:11px 23px;border-radius:30px;font-weight:bold;margin:5px}
.gold-btn{background:var(--gold);border:1px solid var(--gold)}
.outline-btn{background:transparent;color:white;border:1px solid var(--gold)}
nav{position:sticky;top:0;z-index:10;background:#111f;backdrop-filter:blur(12px);padding:12px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--gold)}
nav button{background:#222;color:white;border:1px solid #555;border-radius:25px;padding:8px 13px}
nav button.active,nav button:hover,.cart-button{background:var(--gold);color:#111;border-color:var(--gold)}
.container{width:93%;max-width:1300px;margin:auto;padding:25px 0}
.section-title{text-align:center;margin:30px 0}
.section-title h2{color:var(--gold);font-size:30px}
.section-title p{color:#aaa}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:22px}
.item{background:var(--card);border:1px solid #403522;border-radius:16px;overflow:hidden;transition:.25s}
.item:hover{transform:translateY(-5px);border-color:var(--gold)}
.item img{width:100%;height:175px;object-fit:cover;display:block}
.item-content{padding:14px}
.item h3{color:var(--gold);font-size:19px}
.item p{color:#aaa;font-size:13px;min-height:38px;margin:5px 0}
.prices{display:flex;align-items:center;gap:9px;margin:10px 0}
.old-price{color:#888;text-decoration:line-through;font-size:14px}
.new-price{color:var(--gold);font-size:20px;font-weight:bold}
.discount{background:#9d2727;color:white;padding:3px 8px;border-radius:6px;font-size:12px}
.option-label{display:block;color:#ddd;font-size:13px;margin:9px 0 4px}
.item select{width:100%;background:#292929;color:white;border:1px solid #555;border-radius:7px;padding:8px}
.addons{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:8px 0}
.addons label{font-size:12px;color:#ddd}
.addons input{accent-color:var(--gold)}
.add-btn{width:100%;background:var(--gold);border:0;border-radius:8px;padding:10px;font-weight:bold;margin-top:10px}
.add-btn.added{background:var(--green);color:white}
.cart-panel,.order-result{display:none;background:#171717;border:1px solid var(--gold);padding:22px;border-radius:16px;margin:30px 0}
.cart-panel h2,.order-result h2{color:var(--gold);margin-bottom:15px}
.cart-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #444;flex-wrap:wrap}
.cart-row strong{color:var(--gold)}
.quantity{display:flex;align-items:center;gap:9px}
.quantity button{background:var(--gold);border:0;border-radius:5px;width:27px;height:27px;font-weight:bold}
.remove{background:#8c2929;color:white;border:0;padding:6px 10px;border-radius:6px}
.total{text-align:center;color:var(--gold);font-size:23px;font-weight:bold;margin:18px}
.finish{width:100%;padding:14px;background:var(--gold);border:0;border-radius:9px;font-size:17px;font-weight:bold}
.empty{text-align:center;color:#aaa;padding:15px}
.invoice{background:#fff;color:#222;border-radius:12px;padding:20px;margin:15px 0}
.invoice h3{text-align:center;color:#8a6428;font-size:27px}
.invoice .line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed #bbb}
.invoice .grand{font-size:22px;font-weight:900;color:#158044;border-top:2px solid #888;margin-top:12px;padding-top:12px}
.invoice .saving{color:#168344;font-weight:bold}
.order-type{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}
.order-type button{padding:15px;border:1px solid var(--gold);background:#252525;color:white;border-radius:10px;font-size:16px}
.order-type button.selected{background:var(--gold);color:#111}
footer{text-align:center;background:#111;border-top:2px solid var(--gold);padding:30px;margin-top:45px}
footer h2{color:var(--gold);font-size:32px;letter-spacing:5px}
footer p{color:#aaa;margin-top:8px}
@media(max-width:600px){header .brand{font-size:45px}.language-buttons{flex-direction:column}.order-type{grid-template-columns:1fr}}
@media print{body{background:#fff;color:#111}#languageScreen,header,nav,footer,.cart-panel,.order-type,.finish,.outline-btn{display:none!important}#website{display:block!important}.order-result{display:block!important;background:#fff;border:0;padding:0}.invoice{box-shadow:none;border:1px solid #ddd}}
</style>
</head>

<div id="languageScreen">
 <div class="language-box">

 <button onclick="filterMenu('dessert',this)" data-ar="الحلويات" data-en="Desserts">الحلويات</button>
 <button onclick="filterMenu('drink',this)" data-ar="المشروبات" data-en="Drinks">المشروبات</button>
 <button onclick="filterMenu('combo',this)" data-ar="وجبات كومبو" data-en="Combo Meals">وجبات كومبو</button>
 <button onclick="showFavorites(this)" data-ar="المفضلة ♥" data-en="Favorites ♥">المفضلة ♥</button>
 <button class="cart-button" onclick="toggleCart()" id="cartButton">🛒 الطلبات (0)</button>
</nav>

<main class="container" id="menuArea">
 <div class="section-title">
  <h2 id="menuTitle">قائمة طعام MOKA</h2>
  <p id="menuSubtitle">اختر ما تحب واستمتع بعروضنا</p>
 </div>
 <div class="menu" id="menu"></div>

 <div class="cart-panel" id="cartPanel">
  <h2 id="cartTitle">🛒 طلباتك</h2>
  <div id="cartItems"></div>
  <div class="total" id="cartTotal"></div>
  <button class="finish" onclick="finishOrder()" id="finishButton">تأكيد وإنهاء الطلب</button>
 </div>
 <div class="order-result" id="orderResult"></div>
</main>

<footer>
 <h2>MOKA</h2>
 <p id="footerText">حيث تلتقي الفخامة بأجمل النكهات ❤️</p>
 <p>© 2026 MOKA Restaurant</p>
</footer>
</div>

{id:50,cat:'combo',price:195,off:10,ar:'كومبو الحلو',en:'Dessert Combo',descAr:'قطعتا حلوى + مشروبان ساخنان',descEn:'Two desserts + two hot drinks',img:'https://images.unsplash.com/photo-1488477181946-6428a0291777'}
];

const extras=[
{ar:'جبنة شيدر',en:'Cheddar Cheese',price:15},
{ar:'موتزاريلا',en:'Mozzarella',price:20},
{ar:'مشروم',en:'Mushrooms',price:15},
{ar:'صوص موكا',en:'MOKA Sauce',price:10},
{ar:'صوص باربيكيو',en:'BBQ Sauce',price:10},
{ar:'صوص رانش',en:'Ranch Sauce',price:10}
];

let language='ar',cart=[],currentFilter='all',orderType='',paymentMethod='cash',favorites=JSON.parse(localStorage.getItem('mokaFavorites')||'[]'),ratings=JSON.parse(localStorage.getItem('mokaRatings')||'{}'),favoritesOnly=false;

function start(lang){
 language=lang;
 document.getElementById('languageScreen').style.display='none';
 document.getElementById('website').style.display='block';
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 updateLanguage();renderMenu();
}
function changeLanguage(){
 language=language==='ar'?'en':'ar';
 document.documentElement.lang=language;
 document.documentElement.dir=language==='ar'?'rtl':'ltr';
 updateLanguage();renderMenu();
}
function updateLanguage(){
 const ar=language==='ar';
 const t={
 hero:['الفخامة تبدأ من المذاق','Luxury Begins with Taste'],
 heroText:['اكتشف عالمًا من النكهات الاستثنائية','Discover Exceptional Flavors'],
 explore:['اكتشف القائمة','Explore Menu'],
 langBtn:['English','العربية'],
 menuTitle:['قائمة طعام MOKA','MOKA Menu'],
 menuSubtitle:['اختر ما تحب واستمتع بعروضنا','Choose your favorites and enjoy our offers'],
 cartTitle:['🛒 طلباتك','🛒 Your Order'],
 finishButton:['تأكيد وإنهاء الطلب','Confirm Order'],
 footerText:['حيث تلتقي الفخامة بأجمل النكهات ❤️','Where Luxury Meets Great Taste ❤️']
 };
 for(const id in t)document.getElementById(id).textContent=t[id][ar?0:1];
 document.querySelectorAll('#navigation button:not(.cart-button)').forEach(b=>b.textContent=b.dataset[language]);
 updateCart();
}
function filterMenu(cat,btn){
 favoritesOnly=false;currentFilter=cat;
 document.querySelectorAll('#navigation button').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');renderMenu();
}
function toggleFavorite(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem('mokaFavorites',JSON.stringify(favorites));renderMenu();}
function rateProduct(id,n){ratings[id]=n;localStorage.setItem('mokaRatings',JSON.stringify(ratings));renderMenu();}
function showFavorites(btn){favoritesOnly=true;currentFilter='all';document.querySelectorAll('#navigation button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderMenu();document.getElementById('menuTitle').textContent=language==='ar'?'الأصناف المفضلة':'Favorite Items';}

function sizeOptions(p){
 let sizes;
 if(p.cat==='drink')sizes=[['صغير','Small',0],['وسط','Medium',10],['كبير','Large',20]];
 else if(p.cat==='dessert'||p.cat==='salad'||p.cat==='app')sizes=[['عادي','Regular',0],['كبير','Large',20]];
 else sizes=[['صغير','Small',0],['وسط','Medium',25],['كبير','Large',45]];
 return sizes.map((s,i)=>`<option value="${i}">${language==='ar'?s[0]:s[1]} (+${s[2]} ${language==='ar'?'جنيه':'EGP'})</option>`).join('');
}
function renderMenu(){
 const list=products.filter(p=>(favoritesOnly?favorites.includes(p.id):(currentFilter==='all'||p.cat===currentFilter)));
 document.getElementById('menu').innerHTML=list.map(p=>{
 const sale=Math.round(p.price*(100-p.off)/100);
 return `<div class="item" data-id="${p.id}" style="position:relative">
 <button onclick="toggleFavorite(${p.id})" style="position:absolute;top:10px;right:10px;z-index:2;background:#111d;color:#d6ad60;border:1px solid #d6ad60;border-radius:50%;width:38px;height:38px;font-size:20px">${favorites.includes(p.id)?'♥':'♡'}</button>
 <img src="${p.img}" alt="${p[language]}" loading="lazy">
 <div class="item-content">
 <h3>${p[language]}</h3>
 <p>${p[language==='ar'?'descAr':'descEn']}</p>
 <div style="color:var(--gold);font-size:18px;margin:5px 0">${[1,2,3,4,5].map(n=>`<span onclick=\"rateProduct(${p.id},${n})\" style=\"cursor:pointer\">${n<=(ratings[p.id]||0)?'★':'☆'}</span>`).join('')}</div>
 <div class="prices">
 ${p.off?`<span class="old-price">${p.price} ${language==='ar'?'جنيه':'EGP'}</span><span class="new-price">${sale} ${language==='ar'?'جنيه':'EGP'}</span><span class="discount">-${p.off}%</span>`:`<span class="new-price">${p.price} ${language==='ar'?'جنيه':'EGP'}</span>`}
 </div>
 <label class="option-label">${language==='ar'?'اختار الحجم':'Choose Size'}</label>
 <select class="size-select">${sizeOptions(p)}</select>
 <label class="option-label">${language==='ar'?'إضافات اختيارية':'Optional Extras'}</label>
 <div class="addons">${extras.map((e,i)=>`<label><input type="checkbox" value="${i}"> ${language==='ar'?e.ar:e.en} (+${e.price})</label>`).join('')}</div>
 <button class="add-btn" onclick="addToCart(${p.id},this)">${language==='ar'?'＋ أضف للطلب':'＋ Add to Order'}</button>
 </div></div>`;
 }).join('');
}
function addToCart(id,btn){
 const p=products.find(x=>x.id===id);
 const card=btn.closest('.item');
 const sizeIndex=Number(card.querySelector('.size-select').value);
 let sizes;
 if(p.cat==='drink')sizes=[['صغير','Small',0],['وسط','Medium',10],['كبير','Large',20]];
 else if(p.cat==='dessert'||p.cat==='salad'||p.cat==='app')sizes=[['عادي','Regular',0],['كبير','Large',20]];
 else sizes=[['صغير','Small',0],['وسط','Medium',25],['كبير','Large',45]];
 const size=sizes[sizeIndex];
 const selected=[...card.querySelectorAll('.addons input:checked')].map(x=>extras[Number(x.value)]);
 const extraTotal=selected.reduce((s,x)=>s+x.price,0);
 const sale=Math.round((p.price+size[2])*(100-p.off)/100);
 cart.push({key:Date.now()+Math.random(),id,qty:1,sizeAr:size[0],sizeEn:size[1],sizeExtra:size[2],extras:selected,extraTotal,oldPrice:p.price+size[2],salePrice:sale,discount:(p.price+size[2])-sale});
 updateCart();
 const old=btn.textContent;
 btn.classList.add('added');
 btn.textContent=language==='ar'?'✓ تمت الإضافة':'✓ Added';
 setTimeout(()=>{btn.classList.remove('added');btn.textContent=language==='ar'?'＋ أضف للطلب':'＋ Add to Order'},1500);
}
function calculations(){
 return cart.reduce((a,x)=>{
 a.old+=x.oldPrice*x.qty;
 a.sale+=x.salePrice*x.qty;
 a.extra+=x.extraTotal*x.qty;
 a.discount+=x.discount*x.qty;
 return a;
 },{old:0,sale:0,extra:0,discount:0});
}
function updateCart(){
 const count=cart.reduce((s,x)=>s+x.qty,0);
 document.getElementById('cartButton').textContent=(language==='ar'?'🛒 الطلبات (':'🛒 Cart (')+count+')';
 const area=document.getElementById('cartItems');
 area.innerHTML=cart.length?cart.map(x=>{
 const p=products.find(a=>a.id===x.id);
 const extrasText=x.extras.map(e=>language==='ar'?e.ar:e.en).join('، ')|| (language==='ar'?'بدون إضافات':'No extras');
 return `<div class="cart-row">
 <div><strong>${p[language]}</strong><br><small>${language==='ar'?'الحجم: ':'Size: '}${language==='ar'?x.sizeAr:x.sizeEn} — ${extrasText}</small></div>
 <div class="quantity">
 <button onclick="changeQty('${x.key}',1)">+</button><span>${x.qty}</span>
 <button onclick="changeQty('${x.key}',-1)">−</button>
 </div>
 <span class="price">${(x.salePrice+x.extraTotal)*x.qty} ${language==='ar'?'جنيه':'EGP'}</span>
 <button class="remove" onclick="removeItem('${x.key}')">${language==='ar'?'حذف':'Remove'}</button>
 </div>`;
 }).join(''):`<p class="empty">${language==='ar'?'لم تضف أي أصناف بعد':'Your cart is empty'}</p>`;
 const c=calculations();
 document.getElementById('cartTotal').textContent=(language==='ar'?'الإجمالي بعد الخصم: ':'Total after discount: ')+(c.sale+c.extra)+(language==='ar'?' جنيه':' EGP');
}
function changeQty(key,n){
 const item=cart.find(x=>String(x.key)===key);
 if(!item)return;
 item.qty+=n;
 if(item.qty<=0)cart=cart.filter(x=>x!==item);
 updateCart();
}
function removeItem(key){cart=cart.filter(x=>String(x.key)!==key);updateCart()}
function toggleCart(){
 const panel=document.getElementById('cartPanel');
 panel.style.display=panel.style.display==='block'?'none':'block';
 panel.scrollIntoView({behavior:'smooth',block:'center'});
}
function finishOrder(){
 if(!cart.length){alert(language==='ar'?'أضف صنفاً أولاً':'Please add an item first');return}
 const result=document.getElementById('orderResult');
 result.innerHTML=`
 <h2>${language==='ar'?'اختار طريقة استلام طلبك':'Choose How to Enjoy Your Order'}</h2>
 <div class="order-type">
 <button onclick="selectOrderType('dine',this)">🍽️ ${language==='ar'?'داخل المطعم':'Dine In'}</button>
 <button onclick="selectOrderType('takeaway',this)">🥡 ${language==='ar'?'تيك أواي':'Takeaway'}</button>
 </div>
 <h3 style="color:var(--gold);text-align:center;margin:15px 0 8px">${language==='ar'?'طريقة الدفع':'Payment Method'}</h3>
 <div class="order-type">
 <button onclick="selectPayment('cash',this)">💵 ${language==='ar'?'نقدًا':'Cash'}</button>
 <button onclick="selectPayment('card',this)">💳 ${language==='ar'?'بطاقة بنكية':'Bank Card'}</button>
 <button onclick="selectPayment('wallet',this)">📱 ${language==='ar'?'محفظة إلكترونية':'E-Wallet'}</button>
 </div>
 <p style="text-align:center;color:#aaa">${language==='ar'?'اختار طريقة الاستلام والدفع ثم اعرض الفاتورة':'Choose order type and payment, then view your invoice'}</p>
 <button class="finish" onclick="showFinalOrder()">${language==='ar'?'عرض الفاتورة':'View Invoice'}</button>`;
 result.style.display='block';
 document.getElementById('cartPanel').style.display='none';
 result.scrollIntoView({behavior:'smooth'});
}
function selectPayment(method,btn){paymentMethod=method;document.querySelectorAll('.order-result .order-type button').forEach(b=>{if(b.textContent.includes('💵')||b.textContent.includes('💳')||b.textContent.includes('📱'))b.classList.remove('selected')});btn.classList.add('selected');}
function selectOrderType(type,btn){
 orderType=type;
 document.querySelectorAll('.order-type button').forEach(b=>b.classList.remove('selected'));
 btn.classList.add('selected');
}
function showFinalOrder(){
 if(!orderType){alert(language==='ar'?'اختار طريقة استلام الطلب أولاً':'Please choose an order type first');return}
 const ar=language==='ar',c=calculations();
 const rows=cart.map(x=>{
 const p=products.find(a=>a.id===x.id);
 const extrasText=x.extras.length?x.extras.map(e=>ar?e.ar:e.en).join('، '):(ar?'بدون إضافات':'No extras');
 return `<div class="line"><div><b>${p[language]}</b><br><small>${ar?'الحجم: ':'Size: '}${ar?x.sizeAr:x.sizeEn} | ${extrasText} × ${x.qty}</small></div><span>${(x.salePrice+x.extraTotal)*x.qty} ${ar?'جنيه':'EGP'}</span></div>`;
 }).join('');
 const final=c.sale+c.extra;
 document.getElementById('orderResult').innerHTML=`
 <h2>${ar?'فاتورتك النهائية':'Your Final Invoice'}</h2>
 <div class="invoice">
 <h3>MOKA</h3>
 <p style="text-align:center;color:#777">${ar?'فاتورة طلب':'Order Invoice'} • ${new Date().toLocaleString(ar?'ar-EG':'en-US')}</p>
 <div class="line"><b>${ar?'طريقة الطلب':'Order Type'}</b><span>${orderType==='dine'?(ar?'داخل المطعم':'Dine In'):(ar?'تيك أواي':'Takeaway')}</span></div>
 <div class="line"><b>${ar?'طريقة الدفع':'Payment Method'}</b><span>${paymentMethod==='cash'?(ar?'نقدًا':'Cash'):paymentMethod==='card'?(ar?'بطاقة بنكية':'Bank Card'):(ar?'محفظة إلكترونية':'E-Wallet')}</span></div>
 ${rows}
 <div class="line"><span>${ar?'السعر الأصلي قبل الخصم':'Original Price'}</span><b>${c.old} ${ar?'جنيه':'EGP'}</b></div>
 <div class="line"><span>${ar?'قيمة الخصم':'Discount'}</span><b class="saving">- ${c.discount} ${ar?'جنيه':'EGP'}</b></div>
 <div class="line"><span>${ar?'الإضافات':'Extras'}</span><b>${c.extra} ${ar?'جنيه':'EGP'}</b></div>
 <div class="line"><span>${ar?'السعر بعد الخصم':'Price After Discount'}</span><b>${c.sale} ${ar?'جنيه':'EGP'}</b></div>
 <div class="line grand"><span>${ar?'الإجمالي النهائي':'FINAL TOTAL'}</span><span>${final} ${ar?'جنيه':'EGP'}</span></div>
 <p class="saving" style="text-align:center;margin-top:12px">${ar?'وفرت':'You saved'} ${c.discount} ${ar?'جنيه':'EGP'} 🎉</p>
 </div>
 <button class="finish" onclick="window.print()">${ar?'🖨️ طباعة الفاتورة':'🖨️ Print Invoice'}</button>
 <button class="outline-btn" style="width:100%;margin-top:10px" onclick="newOrder()">${ar?'طلب جديد':'New Order'}</button>`;
 document.getElementById('orderResult').scrollIntoView({behavior:'smooth'});
}
function newOrder(){
 cart=[];orderType='';paymentMethod='cash';updateCart();
 document.getElementById('orderResult').style.display='none';
 document.getElementById('cartPanel').style.display='none';
 document.getElementById('menuArea').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
