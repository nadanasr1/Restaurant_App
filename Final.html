<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOKA Restaurant</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:'Cairo',sans-serif}
button{font-family:inherit;cursor:pointer}
.gold{color:#d6ad55}
header{text-align:center;padding:25px 10px;background:#080808;border-bottom:2px solid #bd963e}
.logo{font-size:48px;font-weight:900;letter-spacing:5px;color:#d6ad55}
.subtitle{color:#ddd}
.screen{display:none;padding:20px;max-width:1100px;margin:auto}
.screen.active{display:block}
.center{text-align:center}
.main-btn,.category-btn,.action-btn{
background:#c49b45;color:#111;border:0;border-radius:10px;
padding:12px 22px;margin:6px;font-weight:800
}
.main-btn{font-size:18px;min-width:140px}
.category-btn{background:#242424;color:#e4bd68;border:1px solid #9e7b36}
.category-btn.active,.category-btn:hover{background:#c49b45;color:#111}
h2{color:#d6ad55;text-align:center}
.categories{display:flex;flex-wrap:wrap;justify-content:center;margin:15px 0}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:#202020;border:1px solid #8e6c30;border-radius:14px;overflow:hidden;position:relative}
.card img{width:100%;height:165px;object-fit:cover}
.card-content{padding:12px}
.card h3{margin:4px 0;color:#e3bd6c}
.price{color:#e8c36e;font-weight:bold;font-size:18px}
.old-price{text-decoration:line-through;color:#999;margin-left:8px}
.heart{position:absolute;top:10px;left:10px;background:#111;color:#fff;border:1px solid #d6ad55;border-radius:50%;width:38px;height:38px;font-size:21px}
.heart.selected{color:#ff526b}
.stars{color:#e7b94f;margin:7px 0}
.stars button{background:none;border:0;color:#e7b94f;font-size:20px;padding:0 2px}
.card select,.card input,.field{
width:100%;padding:10px;margin:6px 0;border-radius:8px;
border:1px solid #9b7938;background:#111;color:#fff;font-family:inherit
}
.card .action-btn{width:100%}
.top-actions{text-align:center;margin:10px}
.panel{background:#202020;border:1px solid #987638;border-radius:12px;padding:15px;margin:15px auto;max-width:700px}
.cart-item{border-bottom:1px solid #555;padding:10px 0}
.total{font-size:22px;color:#e6bd65;font-weight:bold}
.hidden{display:none!important}
.invoice{background:#fff;color:#111;padding:20px;border-radius:10px;max-width:650px;margin:15px auto}
.invoice h2{color:#111}
.invoice table{width:100%;border-collapse:collapse}
.invoice td,.invoice th{border-bottom:1px solid #bbb;padding:8px;text-align:right}
.invoice .total{color:#111}
footer{text-align:center;color:#999;padding:20px}
@media print{
body{background:#fff}
body *{visibility:hidden}
#invoice,#invoice *{visibility:visible}
#invoice{position:absolute;top:0;right:0;width:100%;margin:0}
}
</style>
</head>

<body>

<header>
  <div class="logo">MOKA</div>
  <div class="subtitle">مطعم موكا | MOKA Restaurant</div>
</header>

<!-- شاشة اللغة -->
<section id="languageScreen" class="screen active center">
  <h2>أهلاً بك في MOKA</h2>
  <h2>Welcome to MOKA</h2>
  <p>اختر اللغة | Choose your language</p>
  <button class="main-btn" onclick="setLanguage('ar')">العربية</button>
  <button class="main-btn" onclick="setLanguage('en')">English</button>
</section>

<!-- شاشة القائمة -->
<section id="menuScreen" class="screen">
  <h2 id="menuTitle">قائمة الطعام</h2>

  <div class="categories" id="categories">
    <button class="category-btn active" onclick="showCategory('all',this)">الكل</button>
    <button class="category-btn" onclick="showCategory('meals',this)">وجبات</button>
    <button class="category-btn" onclick="showCategory('combo',this)">وجبات كومبو</button>
    <button class="category-btn" onclick="showCategory('pizza',this)">بيتزا</button>
    <button class="category-btn" onclick="showCategory('grill',this)">مشويات</button>
    <button class="category-btn" onclick="showCategory('starters',this)">مقبلات</button>
    <button class="category-btn" onclick="showCategory('salads',this)">سلطات</button>
    <button class="category-btn" onclick="showCategory('desserts',this)">حلويات</button>
    <button class="category-btn" onclick="showCategory('drinks',this)">مشروبات</button>
    <button class="category-btn" onclick="showCategory('favorites',this)">❤️ المفضلة</button>
  </div>

  <div class="top-actions">
    <button class="category-btn" onclick="openCart()">🛒 السلة (<span id="cartCount">0</span>)</button>
    <button class="category-btn" onclick="openCart()">عرض الطلبات</button>
  </div>

  <div class="products" id="products"></div>
</section>

<!-- شاشة السلة -->
<section id="cartScreen" class="screen">
  <h2>طلباتك | Your Order</h2>
  <div class="panel">
    <div id="cartItems"></div>
    <p class="total">الإجمالي: <span id="cartTotal">0</span> جنيه</p>
    <button class="main-btn" onclick="clearCart()">إفراغ السلة</button>
    <button class="main-btn" onclick="backToMenu()">العودة للقائمة</button>
    <button class="main-btn" onclick="goToCheckout()">تأكيد الطلب</button>
  </div>
</section>

<!-- شاشة تأكيد الطلب -->
<section id="checkoutScreen" class="screen">
  <h2>تأكيد الطلب | Checkout</h2>
  <div class="panel">
    <label>نوع الطلب | Order type</label>
    <select class="field" id="orderType">
      <option value="داخل المطعم">داخل المطعم</option>
      <option value="تيك أواي">تيك أواي</option>
    </select>

    <label>طريقة الدفع | Payment method</label>
    <select class="field" id="paymentMethod">
      <option value="نقداً">نقداً عند الاستلام</option>
      <option value="بطاقة بنكية">بطاقة بنكية</option>
      <option value="محفظة إلكترونية">محفظة إلكترونية</option>
    </select>

    <label>اسم العميل | Customer name</label>
    <input class="field" id="customerName" placeholder="اكتب اسمك">

    <label>ملاحظات | Notes</label>
    <textarea class="field" id="orderNotes" rows="3" placeholder="أي ملاحظات على الطلب"></textarea>

    <button class="main-btn" onclick="finishOrder()">إنهاء الطلب</button>
    <button class="main-btn" onclick="openCart()">رجوع</button>
  </div>
</section>

<!-- الفاتورة -->
<section id="invoiceScreen" class="screen">
  <h2>فاتورة MOKA</h2>
  <div class="invoice" id="invoice">
    <h2>MOKA Restaurant</h2>
    <p>مطعم موكا</p>
    <p id="invoiceDate"></p>
    <p id="invoiceCustomer"></p>
    <p id="invoiceType"></p>
    <p id="invoicePayment"></p>
    <table>
      <thead>
        <tr><th>الصنف</th><th>العدد</th><th>السعر</th></tr>
      </thead>
      <tbody id="invoiceRows"></tbody>
    </table>
    <p id="invoiceNotes"></p>
    <p class="total">الإجمالي: <span id="invoiceTotal"></span> جنيه</p>
    <p style="text-align:center">شكراً لاختياركم MOKA ❤️</p>
  </div>
  <div class="center">
    <button class="main-btn" onclick="window.print()">طباعة الفاتورة</button>
    <button class="main-btn" onclick="newOrder()">طلب جديد</button>
  </div>
</section>

<footer>© MOKA Restaurant</footer>

<script>
let language = 'ar';
let currentCategory = 'all';
let cart = [];
let favorites = JSON.parse(localStorage.getItem('mokaFavorites') || '[]');
let ratings = JSON.parse(localStorage.getItem('mokaRatings') || '{}');

const products = [
{id:1,cat:'meals',ar:'وجبة برجر',en:'Burger Meal',price:180,off:10,img:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600'},
{id:2,cat:'meals',ar:'وجبة فراخ كرسبي',en:'Crispy Chicken Meal',price:160,off:0,img:'https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=600'},
{id:3,cat:'meals',ar:'وجبة شاورما فراخ',en:'Chicken Shawarma Meal',price:150,off:0,img:'https://images.unsplash.com/photo-1529006557810-274b9b2fc783?w=600'},
{id:4,cat:'meals',ar:'وجبة كفتة',en:'Kofta Meal',price:190,off:5,img:'https://images.unsplash.com/photo-1544025162-d76694265947?w=600'},
{id:5,cat:'meals',ar:'وجبة زنجر',en:'Zinger Meal',price:170,off:0,img:'https://images.unsplash.com/photo-1606755962773-d324e0a13086?w=600'},
{id:6,cat:'meals',ar:'وجبة تشيكن ستيك',en:'Chicken Steak Meal',price:210,off:0,img:'https://images.unsplash.com/photo-1532550907401-a500c9a57435?w=600'},

{id:45,cat:'combo',ar:'كومبو برجر',en:'Burger Combo',price:220,off:5,img:'https://images.unsplash.com/photo-1571091718767-18b5b1457add?w=600'},
{id:46,cat:'combo',ar:'كومبو زنجر',en:'Zinger Combo',price:210,off:0,img:'https://images.unsplash.com/photo-1606755962773-d324e0a13086?w=600'},
{id:47,cat:'combo',ar:'كومبو شاورما',en:'Shawarma Combo',price:200,off:0,img:'https://images.unsplash.com/photo-1529006557810-274b9b2fc783?w=600'},
{id:48,cat:'combo',ar:'كومبو فراخ كرسبي',en:'Crispy Chicken Combo',price:215,off:0,img:'https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=600'},
{id:49,cat:'combo',ar:'كومبو ميكس',en:'Mixed Combo',price:260,off:10,img:'https://images.unsplash.com/photo-1544025162-d76694265947?w=600'},

{id:7,cat:'pizza',ar:'بيتزا مارجريتا',en:'Margherita Pizza',price:160,off:0,img:'https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=600'},
{id:8,cat:'pizza',ar:'بيتزا بيبروني',en:'Pepperoni Pizza',price:210,off:10,img:'https://images.unsplash.com/photo-1628840042765-356cda07504e?w=600'},
{id:9,cat:'pizza',ar:'بيتزا فراخ',en:'Chicken Pizza',price:200,off:0,img:'https://images.unsplash.com/photo-1593560708920-61dd98c46a4e?w=600'},
{id:10,cat:'pizza',ar:'بيتزا ميكس جبن',en:'Four Cheese Pizza',price:220,off:0,img:'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600'},

{id:11,cat:'grill',ar:'كباب مشوي',en:'Grilled Kebab',price:280,off:0,img:'https://images.unsplash.com/photo-1544025162-d76694265947?w=600'},
{id:12,cat:'grill',ar:'كفتة مشوية',en:'Grilled Kofta',price:240,off:0,img:'https://images.unsplash.com/photo-1558030006-450675393462?w=600'},
{id:13,cat:'grill',ar:'فراخ مشوية',en:'Grilled Chicken',price:260,off:5,img:'https://images.unsplash.com/photo-1532550907401-a500c9a57435?w=600'},

{id:14,cat:'starters',ar:'بطاطس مقلية',en:'French Fries',price:55,off:0,img:'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=600'},
{id:15,cat:'starters',ar:'حلقات بصل',en:'Onion Rings',price:65,off:0,img:'https://images.unsplash.com/photo-1639024471283-03518883512d?w=600'},
{id:16,cat:'starters',ar:'موزاريلا ستيكس',en:'Mozzarella Sticks',price:85,off:0,img:'https://images.unsplash.com/photo-1531749668029-2db88e4276c7?w=600'},

{id:17,cat:'salads',ar:'سلطة خضراء',en:'Green Salad',price:45,off:0,img:'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=600'},
{id:18,cat:'salads',ar:'سلطة سيزر',en:'Caesar Salad',price:95,off:0,img:'https://images.unsplash.com/photo-1546793665-c74683f339c1?w=600'},
{id:19,cat:'salads',ar:'كول سلو',en:'Coleslaw',price:50,off:0,img:'https://images.unsplash.com/photo-1625938145744-e380515399bf?w=600'},

{id:20,cat:'desserts',ar:'تشيز كيك',en:'Cheesecake',price:90,off:0,img:'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=600'},
{id:21,cat:'desserts',ar:'براونيز',en:'Brownies',price:75,off:0,img:'https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=600'},
{id:22,cat:'desserts',ar:'مولتن كيك',en:'Molten Cake',price:100,off:0,img:'https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=600'},
{id:23,cat:'desserts',ar:'آيس كريم',en:'Ice Cream',price:60,off:0,img:'https://images.unsplash.com/photo-1501446529957-6226bd447c46?w=600'},

{id:24,cat:'drinks',ar:'كولا',en:'Cola',price:30,off:0,img:'https://images.unsplash.com/photo-1554866585-cd94860890b7?w=600'},
{id:25,cat:'drinks',ar:'عصير برتقال',en:'Orange Juice',price:45,off:0,img:'https://images.unsplash.com/photo-1600271886742-f049cd451bba?w=600'},
{id:26,cat:'drinks',ar:'ليمون بالنعناع',en:'Lemon Mint',price:50,off:0,img:'https://images.unsplash.com/photo-1513558161293-cdaf765edfd4?w=600'},
{id:27,cat:'drinks',ar:'مياه معدنية',en:'Mineral Water',price:15,off:0,img:'https://images.unsplash.com/photo-1523362628745-0c100150b504?w=600'}
];

function setLanguage(lang){
 language=lang;
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 document.getElementById('languageScreen').classList.remove('active');
 document.getElementById('menuScreen').classList.add('active');
 document.getElementById('menuTitle').textContent=lang==='ar'?'قائمة الطعام':'Our Menu';
 showCategory('all');
}

function showScreen(id){
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}

function showCategory(cat,btn){
 currentCategory=cat;
 document.querySelectorAll('.category-btn').forEach(b=>b.classList.remove('active'));
 if(btn)btn.classList.add('active');

 let list=products.filter(p=>{
  if(cat==='all')return true;
  if(cat==='favorites')return favorites.includes(p.id);
  return p.cat===cat;
 });

 const container=document.getElementById('products');
 container.innerHTML='';

 if(list.length===0){
  container.innerHTML='<p class="center">لا توجد أصناف في هذا القسم حتى الآن</p>';
  return;
 }

 list.forEach(p=>{
  let name=language==='ar'?p.ar:p.en;
  let finalPrice=Math.round(p.price*(100-p.off)/100);
  let isFav=favorites.includes(p.id);
  let rating=ratings[p.id]||0;

  container.innerHTML+=`
  <div class="card">
   <button class="heart ${isFav?'selected':''}" onclick="toggleFavorite(${p.id})">${isFav?'♥':'♡'}</button>
   <img src="${p.img}" alt="${name}" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600'">
   <div class="card-content">
    <h3>${name}</h3>
    <div class="price">
     ${p.off?`<span class="old-price">${p.price} ج</span>`:''}
     ${finalPrice} جنيه
    </div>
    <div class="stars">
     ${[1,2,3,4,5].map(n=>`<button onclick="rateProduct(${p.id},${n})">${n<=rating?'★':'☆'}</button>`).join('')}
     <small>${language==='ar'?'قيّم الصنف':'Rate this item'}</small>
    </div>
    <select id="size-${p.id}">
     <option value="عادي">عادي</option>
     <option value="كبير">كبير (+30 جنيه)</option>
     <option value="عائلي">عائلي (+60 جنيه)</option>
    </select>
    <select id="extra-${p.id}">
     <option value="بدون إضافات">بدون إضافات</option>
     <option value="جبنة إضافية">جبنة إضافية (+15 جنيه)</option>
     <option value="صوص إضافي">صوص إضافي (+10 جنيه)</option>
     <option value="بطاطس إضافية">بطاطس إضافية (+20 جنيه)</option>
    </select>
    <button class="action-btn" onclick="addToCart(${p.id})">${language==='ar'?'أضف إلى السلة':'Add to cart'}</button>
   </div>
  </div>`;
 });
}

function toggleFavorite(id){
 if(favorites.includes(id)){
  favorites=favorites.filter(x=>x!==id);
 }else{
  favorites.push(id);
 }
 localStorage.setItem('mokaFavorites',JSON.stringify(favorites));
 showCategory(currentCategory);
}

function rateProduct(id,value){
 ratings[id]=value;
 localStorage.setItem('mokaRatings',JSON.stringify(ratings));
 showCategory(currentCategory);
}

function addToCart(id){
 let p=products.find(x=>x.id===id);
 let size=document.getElementById('size-'+id).value;
 let extra=document.getElementById('extra-'+id).value;
 let price=Math.round(p.price*(100-p.off)/100);

 if(size==='كبير')price+=30;
 if(size==='عائلي')price+=60;
 if(extra==='جبنة إضافية')price+=15;
 if(extra==='صوص إضافي')price+=10;
 if(extra==='بطاطس إضافية')price+=20;

 let old=cart.find(x=>x.id===id&&x.size===size&&x.extra===extra);
 if(old)old.qty++;
 else cart.push({id,name:language==='ar'?p.ar:p.en,size,extra,price,qty:1});

 updateCart();
 alert(language==='ar'?'تمت إضافة الصنف إلى السلة':'Item added to cart');
}

function updateCart(){
 document.getElementById('cartCount').textContent=cart.reduce((s,x)=>s+x.qty,0);
 document.getElementById('cartTotal').textContent=cart.reduce((s,x)=>s+x.price*x.qty,0);

 let box=document.getElementById('cartItems');
 box.innerHTML='';
 cart.forEach((x,i)=>{
  box.innerHTML+=`
  <div class="cart-item">
   <strong>${x.name}</strong><br>
   الحجم: ${x.size} | الإضافة: ${x.extra}<br>
   السعر: ${x.price} جنيه × ${x.qty}
   <button class="category-btn" onclick="changeQty(${i},-1)">−</button>
   <button class="category-btn" onclick="changeQty(${i},1)">+</button>
   <button class="category-btn" onclick="removeItem(${i})">حذف</button>
  </div>`;
 });
}

function changeQty(i,n){
 cart[i].qty+=n;
 if(cart[i].qty<=0)cart.splice(i,1);
 updateCart();
}
function removeItem(i){cart.splice(i,1);updateCart()}
function clearCart(){cart=[];updateCart()}
function openCart(){updateCart();showScreen('cartScreen')}
function backToMenu(){showScreen('menuScreen')}
function goToCheckout(){
 if(cart.length===0){alert('السلة فارغة');return}
 showScreen('checkoutScreen');
}

function finishOrder(){
 if(cart.length===0)return;

 let total=cart.reduce((s,x)=>s+x.price*x.qty,0);
 let rows='';

 cart.forEach(x=>{
  rows+=`<tr><td>${x.name}<br><small>${x.size} - ${x.extra}</small></td><td>${x.qty}</td><td>${x.price*x.qty} جنيه</td></tr>`;
 });

 document.getElementById('invoiceRows').innerHTML=rows;
 document.getElementById('invoiceTotal').textContent=total;
 document.getElementById('invoiceDate').textContent='التاريخ: '+new Date().toLocaleString('ar-EG');
 document.getElementById('invoiceCustomer').textContent='اسم العميل: '+(document.getElementById('customerName').value||'عميل MOKA');
 document.getElementById('invoiceType').textContent='نوع الطلب: '+document.getElementById('orderType').value;
 document.getElementById('invoicePayment').textContent='طريقة الدفع المختارة: '+document.getElementById('paymentMethod').value;
 document.getElementById('invoiceNotes').textContent='ملاحظات: '+document.getElementById('orderNotes').value;

 showScreen('invoiceScreen');
}

function newOrder(){
 cart=[];
 updateCart();
 document.getElementById('customerName').value='';
 document.getElementById('orderNotes').value='';
 showScreen('menuScreen');
 showCategory('all');
}

updateCart();
</script>
</body>
</html>
